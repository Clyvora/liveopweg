worker_processes auto;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  log_format structured escape=json '{"time":"$time_iso8601","remote":"$remote_addr","request":"$request","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
  access_log /var/log/nginx/access.log structured;

  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream mobility_web { server web:3000; keepalive 16; }
  upstream mobility_realtime { server realtime:8081; keepalive 16; }

  server {
    listen 8080;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /v1/realtime {
      limit_conn ws_per_ip 4;
      proxy_pass http://mobility_realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 75s;
      proxy_send_timeout 15s;
    }

    location /v1/ {
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://mobility_realtime;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
      proxy_pass http://mobility_realtime;
    }

    location / {
      proxy_pass http://mobility_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
